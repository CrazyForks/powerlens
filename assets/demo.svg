<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440">
  <defs>
    <style>
      .term-bg { fill: #0d1117; }
      .title-bar { fill: #1c1c1e; }
      .btn-red { fill: #ff5f57; }
      .btn-yellow { fill: #febc2e; }
      .btn-green { fill: #28c840; }
      .prompt { fill: #6e7681; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .cursor { fill: #58a6ff; }
      .label { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; }
      .section-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; }
      .badge-bg { rx: 4; }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect width="780" height="440" rx="10" class="term-bg"/>

  <!-- Title bar -->
  <rect width="780" height="38" rx="10" class="title-bar"/>
  <rect y="19" width="780" height="19" class="title-bar"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="19" r="6" class="btn-red"/>
  <circle cx="40" cy="19" r="6" class="btn-yellow"/>
  <circle cx="60" cy="19" r="6" class="btn-green"/>

  <!-- Window title -->
  <text x="390" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#6e7681">zsh — powerlens demo</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- Section: Idle / Low load -->
  <!-- ═══════════════════════════════════════ -->
  <text x="20" y="70" class="section-title">● Idle State</text>
  <rect x="20" y="78" width="740" height="36" rx="4" fill="#161b22"/>

  <!-- Prompt -->
  <text x="32" y="101" class="prompt" fill="#6e7681">~/projects/myapp</text>
  <text x="164" y="101" class="prompt" fill="#3fb950"> ❯</text>
  <rect x="178" y="89" width="8" height="14" class="cursor" opacity="0.8"/>

  <!-- RPROMPT — Idle: all green, right-aligned -->
  <text x="476" y="101" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00ff9f">⚡8W</text>
  <text x="522" y="101" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00ff9f">🔋94%</text>
  <text x="564" y="101" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00ff9f">⚙9%</text>
  <text x="610" y="101" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00ff9f">🌡42°</text>
  <text x="658" y="101" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00ff9f">🧠34%</text>
  <text x="760" y="101" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#6e7681">↑0.1M↓0.2M</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- Section: Moderate load -->
  <!-- ═══════════════════════════════════════ -->
  <text x="20" y="142" class="section-title">● Moderate Load  (compiling / running tests)</text>
  <rect x="20" y="150" width="740" height="36" rx="4" fill="#161b22"/>

  <text x="32" y="173" class="prompt" fill="#6e7681">~/projects/myapp</text>
  <text x="164" y="173" class="prompt" fill="#3fb950"> ❯</text>
  <text x="183" y="173" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#6e7681">make test</text>

  <!-- RPROMPT — Moderate: mixed colors, right-aligned -->
  <text x="476" y="173" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00d4ff">⚡28W</text>
  <text x="522" y="173" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00d4ff">🔋78%</text>
  <text x="564" y="173" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#ff006e">⚙72%</text>
  <text x="610" y="173" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00d4ff">🌡67°</text>
  <text x="658" y="173" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00d4ff">🧠58%</text>
  <text x="760" y="173" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#6e7681">↑0.3M↓1.1M</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- Section: High load -->
  <!-- ═══════════════════════════════════════ -->
  <text x="20" y="214" class="section-title">● High Load  (video export / ML training)</text>
  <rect x="20" y="222" width="740" height="36" rx="4" fill="#161b22"/>

  <text x="32" y="245" class="prompt" fill="#6e7681">~/projects/myapp</text>
  <text x="164" y="245" class="prompt" fill="#3fb950"> ❯</text>
  <text x="183" y="245" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#6e7681">python train.py</text>

  <!-- RPROMPT — Peak: orange/pink across the board, right-aligned -->
  <text x="476" y="245" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#ff9500">⚡62W</text>
  <text x="522" y="245" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00d4ff">🔋55%</text>
  <text x="564" y="245" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#ff9500">⚙91%</text>
  <text x="610" y="245" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#ff9500">🌡85°</text>
  <text x="658" y="245" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#ff9500">🧠88%</text>
  <text x="760" y="245" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#6e7681">↑2.4M↓8.7M</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- Section: Full mode -->
  <!-- ═══════════════════════════════════════ -->
  <text x="20" y="286" class="section-title">● Full Mode  (POWERLENS_MODE=full)</text>
  <rect x="20" y="294" width="740" height="36" rx="4" fill="#161b22"/>

  <text x="32" y="317" class="prompt" fill="#6e7681">~</text>
  <text x="45" y="317" class="prompt" fill="#3fb950"> ❯</text>
  <rect x="58" y="305" width="8" height="14" class="cursor" opacity="0.8"/>

  <!-- RPROMPT — Full mode with units, right-aligned -->
  <text x="330" y="317" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00d4ff">⚡38.4W</text>
  <text x="387" y="317" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00d4ff">🔋72%</text>
  <text x="452" y="317" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#ff006e">⚙47.3%</text>
  <text x="522" y="317" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#00d4ff">🌡58.2°C</text>
  <text x="591" y="317" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#ff006e">🧠76.8%</text>
  <text x="760" y="317" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#6e7681">↑ 2.4MB/s  ↓ 8.1MB/s</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- Section: Alert mode -->
  <!-- ═══════════════════════════════════════ -->
  <text x="20" y="358" class="section-title">● Alert Mode  (POWERLENS_COLOR_MODE=alert) — neutral until threshold crossed</text>
  <rect x="20" y="366" width="740" height="36" rx="4" fill="#161b22"/>

  <text x="32" y="389" class="prompt" fill="#6e7681">~/workspace</text>
  <text x="122" y="389" class="prompt" fill="#3fb950"> ❯</text>
  <rect x="136" y="377" width="8" height="14" class="cursor" opacity="0.8"/>

  <!-- RPROMPT — Alert: gray for under-threshold, orange for over, right-aligned -->
  <text x="476" y="389" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#aaaaaa">⚡42W</text>
  <text x="522" y="389" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#aaaaaa">🔋81%</text>
  <text x="564" y="389" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#aaaaaa">⚙44%</text>
  <text x="610" y="389" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#aaaaaa">🌡72°</text>
  <text x="658" y="389" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#ff9500">🧠87%</text>
  <text x="760" y="389" text-anchor="end" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#aaaaaa">↑0.8M↓3.2M</text>

  <!-- Annotation arrow + label for alert mode -->
  <line x1="638" y1="400" x2="638" y2="418" stroke="#ff9500" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="640" y="430" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#ff9500">mem &gt; 85% threshold</text>

  <!-- Bottom border line -->
  <line x1="0" y1="438" x2="780" y2="438" stroke="#30363d" stroke-width="1"/>
</svg>
